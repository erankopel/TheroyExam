name: Deploy to GitHub Pages

# Publishes the static site whenever the repository's default branch changes (or on demand).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Validate data
        run: python3 tools/validate_data.py

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker (cache version + precache list)
        run: python3 tools/build_sw.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js fonts img _site/
          cp data/questions.json data/units.json _site/data/
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
