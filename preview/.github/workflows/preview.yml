name: Publish v2 preview

# Publishes a marked, separate copy of the app from a branch of erankopel/TheroyExam (default: claude/v2-explanations).
# It lives on its own address, so its saved progress never touches the real site.
# - every hour: redeploys only when the branch has a new commit
# - manually: Actions -> Publish v2 preview -> Run workflow (optionally with another branch name)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch of erankopel/TheroyExam to publish'
        default: 'claude/v2-explanations'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: true

env:
  SOURCE_REPO: erankopel/TheroyExam
  DEFAULT_REF: claude/v2-explanations

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.c.outputs.ref }}
      sha: ${{ steps.c.outputs.sha }}
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - id: c
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT: ${{ github.event_name }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          REF="${INPUT_REF:-$DEFAULT_REF}"
          SHA=$(git ls-remote "https://github.com/$SOURCE_REPO" "refs/heads/$REF" | cut -f1)
          if [ -z "$SHA" ]; then echo "::error title=Branch not found::$SOURCE_REPO has no branch '$REF'"; exit 1; fi
          LIVE=$(curl -fsS "$SITE/version.txt" 2>/dev/null | head -1 || true)
          CHANGED=true
          if [ "$EVENT" = "schedule" ] && [ "$LIVE" = "$SHA" ]; then CHANGED=false; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "source $REF @ $SHA, live @ ${LIVE:-none}, deploy: $CHANGED"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: preview }
      - uses: actions/checkout@v4
        with:
          repository: erankopel/TheroyExam
          ref: ${{ needs.check.outputs.sha }}
          path: src
      - name: Stamp service worker (cache version + precache list)
        run: cd src && python3 tools/build_sw.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r src/index.html src/manifest.webmanifest src/sw.js src/css src/js src/fonts src/img _site/
          cp src/data/questions.json src/data/units.json _site/data/
          [ -f src/data/explanations.json ] && cp src/data/explanations.json _site/data/ || true
          touch _site/.nojekyll
      - name: Mark as preview
        run: python3 preview/patch_preview.py _site "${{ needs.check.outputs.sha }}" "${{ needs.check.outputs.ref }}"
      - name: Sanity check
        run: |
          test -s _site/data/questions.json && test -s _site/data/units.json
          grep -q 'id="preview-badge"' _site/index.html
          grep -q 'noindex' _site/index.html
          python3 -c "import json; json.load(open('_site/manifest.webmanifest'))"
          echo "files: $(find _site -type f | wc -l)"
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be switched on once (Settings -> Pages -> Source: GitHub Actions). Until then this job ends with a
      # warning instead of a red X, so no failure e-mails are sent.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Open Settings -> Pages -> Build and deployment -> Source and choose 'GitHub Actions', then run this workflow again."
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
